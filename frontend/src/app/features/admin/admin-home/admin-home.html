<div class="admin-screen">
  <header class="brand">
    <span class="wordmark" role="img" aria-label="Dor">D<i class="o"></i>r</span>
    <button class="btn btn-quiet btn-sm" type="button" (click)="logout()">Sign out</button>
  </header>

  <main class="admin-main">
    <h1>Admin</h1>
    <p class="subtitle">Signed in as {{ fullName() }}.</p>

    <div class="panels">
      <app-catalog-panel resource="services" title="Services" singular="Service" />
      <app-catalog-panel resource="counters" title="Counters" singular="Counter" />
    </div>
  </main>
</div>
