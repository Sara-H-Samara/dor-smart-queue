<div class="admin-screen">
  <header class="app-header">
    <span class="wordmark" role="img" aria-label="Dor">D<i class="wordmark-o"></i>r</span>
    <button class="btn btn-quiet btn-sm" type="button" (click)="signOut()">Sign out</button>
  </header>

  <main class="admin-main">
    <h1>Admin</h1>
    <p class="subtitle">Signed in as {{ fullName() }}.</p>

    <div class="panels">
      <app-catalog-panel catalogResource="services" heading="Services" itemLabel="Service" />
      <app-catalog-panel catalogResource="counters" heading="Counters" itemLabel="Counter" />
    </div>
  </main>
</div>
