<div class="admin-screen">
  <header class="app-header app-header-sticky">
    <span class="wordmark" role="img" aria-label="Dor">D<i class="wordmark-o"></i>r</span>
    <div class="header-actions">
      <span class="header-user-label">Admin</span>
      <button class="header-text-button" type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <h1>Admin</h1>
    <p class="lede">Manage the services your office offers and the counters that serve them.</p>

    <div class="panels">
      <app-catalog-panel
        catalogResource="services"
        heading="Services"
        itemLabel="Service"
        emptyText="Add a service so students can start taking tickets."
      />
      <app-catalog-panel
        catalogResource="counters"
        heading="Counters"
        itemLabel="Counter"
        emptyText="Add a counter so staff can start serving students."
      />
    </div>
  </main>
</div>
