<div class="admin-screen">
  <app-page-header [showSignOut]="true" (signOutRequested)="signOut()" />

  <main class="admin-main">
    <h1>Admin</h1>
    <p class="lede">Manage the services your office offers and the counters that serve them.</p>
    <a class="users-link" routerLink="/admin/users">Manage users →</a>

    <app-section-switch
      [sections]="sectionOptions"
      groupName="admin-section"
      groupLabel="Section"
      [(selectedSection)]="selectedSection"
    />

    <div class="panels">
      <app-catalog-panel
        [class.panel-hidden-on-phone]="selectedSection() !== 'services'"
        catalogResource="services"
        [firstLoadRequest]="firstLoadRequest"
        [refreshRequests]="refreshRequests"
        heading="Services"
        itemLabel="Service"
        emptyText="Add a service so students can start taking tickets."
      />
      <app-catalog-panel
        [class.panel-hidden-on-phone]="selectedSection() !== 'counters'"
        catalogResource="counters"
        [firstLoadRequest]="firstLoadRequest"
        [refreshRequests]="refreshRequests"
        heading="Counters"
        itemLabel="Counter"
        emptyText="Add a counter so staff can start serving students."
      />
    </div>
  </main>
</div>
