<div class="list-row">
  <span class="notched-code-tile" aria-hidden="true">
    @if (tileText(); as text) {
      {{ text }}
    } @else {
      <svg class="tile-glyph" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="6.5" r="2.5" />
        <path d="M3 11h18v3H3zM6 14v6M18 14v6" />
      </svg>
    }
  </span>
  <span class="list-row-meta">
    <span class="list-row-name">{{ item().name }}</span>
    @if (detailText(); as text) {
      <span class="list-row-detail">{{ text }}</span>
    }
  </span>
  <label class="toggle-switch">
    <input
      type="checkbox"
      role="switch"
      [checked]="item().active"
      [disabled]="isBusy()"
      [attr.aria-label]="item().name"
      (change)="onSwitchChanged($event)"
    />
    <span class="toggle-state">{{ item().active ? 'Active' : 'Inactive' }}</span>
    <span class="toggle-track"></span>
  </label>
  <button
    class="row-icon-button"
    type="button"
    [disabled]="isBusy()"
    [attr.aria-label]="'Rename ' + item().name"
    (click)="renameRequested.emit()"
  >
    <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
    </svg>
  </button>
</div>
