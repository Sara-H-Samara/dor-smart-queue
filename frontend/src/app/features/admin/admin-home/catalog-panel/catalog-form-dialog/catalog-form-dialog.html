<dialog
  #dialog
  class="catalog-dialog"
  [attr.aria-labelledby]="idPrefix() + '-title'"
  (close)="onDialogClose()"
>
  <form (submit)="$event.preventDefault(); validateAndEmit()" novalidate>
    <h3 [id]="idPrefix() + '-title'">{{ heading() }}</h3>

    @if (errorMessage(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <div class="dialog-fields">
      <div class="field field-name">
        <label [for]="idPrefix() + '-name'">{{ nameLabel() }}</label>
        <input
          #nameInput
          [id]="idPrefix() + '-name'"
          type="text"
          maxlength="100"
          autocomplete="off"
          [formControl]="nameControl"
          [attr.aria-invalid]="nameControl.touched && nameControl.invalid"
          [attr.aria-describedby]="nameControl.touched && nameControl.invalid ? idPrefix() + '-name-error' : null"
        />
        @if (nameControl.touched && nameControl.invalid) {
          <p class="field-error" role="alert" [id]="idPrefix() + '-name-error'">Name is required.</p>
        }
      </div>
      @if (showCodeField()) {
        <div class="field field-code">
          <label [for]="idPrefix() + '-code'">Code</label>
          <input
            [id]="idPrefix() + '-code'"
            class="code-input"
            type="text"
            maxlength="2"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            [formControl]="codeControl"
            (input)="normalizeCodeInput()"
            [attr.aria-invalid]="shouldShowCodeError || !!codeConflictMessage()"
            [attr.aria-describedby]="
              shouldShowCodeError || codeConflictMessage() ? idPrefix() + '-code-error' : null
            "
          />
          @if (shouldShowCodeError) {
            <p class="field-error" role="alert" [id]="idPrefix() + '-code-error'">
              Enter 1 or 2 English letters.
            </p>
          } @else if (codeConflictMessage(); as message) {
            <p class="field-error" role="alert" [id]="idPrefix() + '-code-error'">{{ message }}</p>
          }
        </div>
      }
    </div>

    <div class="dialog-actions">
      <button class="btn btn-quiet btn-sm" type="button" (click)="closeAndReset()">Cancel</button>
      <button class="btn btn-sm" type="submit" [disabled]="isSaving()">{{ submitLabel() }}</button>
    </div>
  </form>
</dialog>
