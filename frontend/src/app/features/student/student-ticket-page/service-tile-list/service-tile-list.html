<section aria-label="Available services">
  <p class="lede">Choose a service to take one.</p>

  @if (services().length === 0) {
    <p class="notice" role="status">No services are open right now.</p>
  } @else {
    <ul class="tiles">
      @for (service of services(); track service.id) {
        <li>
          <button
            class="service-tile"
            type="button"
            [class.service-tile-unavailable]="!service.hasOpenCounter"
            [disabled]="isTakingTicket()"
            [attr.aria-disabled]="service.hasOpenCounter ? null : 'true'"
            [attr.aria-describedby]="service.hasOpenCounter ? null : 'service-note-' + service.id"
            (click)="chooseService(service)"
          >
            <span class="code-tile" aria-hidden="true">{{ service.code }}</span>
            <span class="service-text">
              <span class="service-name">{{ service.name }}</span>
              @if (!service.hasOpenCounter) {
                <span class="service-note" [id]="'service-note-' + service.id"
                  >No counter open right now</span
                >
              }
            </span>
          </button>
        </li>
      }
    </ul>
  }
</section>
